name: Backend CI

on:
    push:
        branches:
            - '[0-9]+.[0-9]+'
    pull_request: ~
    workflow_dispatch: ~

jobs:
    cs-fix:
        name: Run code style check
        runs-on: "ubuntu-26.04"
        steps:
            -   uses: actions/checkout@v7

            -   uses: ibexa/gh-workflows/actions/composer-install@main
                with:
                    php-version: '8.1'
                    gh-client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
                    gh-client-secret: ${{ secrets.AUTOMATION_CLIENT_SECRET }}
                    satis-network-key: ${{ secrets.SATIS_NETWORK_KEY }}
                    satis-network-token: ${{ secrets.SATIS_NETWORK_TOKEN }}

            -   name: Run code style check
                shell: bash
                run: |
                    set -euo pipefail
                    composer run-script check-cs -- --format=checkstyle | cs2pr

    tests:
        name: Tests on SQLite
        runs-on: "ubuntu-26.04"
        timeout-minutes: 10

        strategy:
            fail-fast: false
            matrix:
                php:
                    - '7.4'
                    - '8.3'
                    - '8.4'

        steps:
            - uses: actions/checkout@v7

            - uses: ibexa/gh-workflows/actions/composer-install@main
              with:
                  php-version: ${{ matrix.php }}
                  gh-client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
                  gh-client-secret: ${{ secrets.AUTOMATION_CLIENT_SECRET }}
                  satis-network-key: ${{ secrets.SATIS_NETWORK_KEY }}
                  satis-network-token: ${{ secrets.SATIS_NETWORK_TOKEN }}

            - name: Setup problem matchers for PHPUnit
              run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            - name: Run PHPStan analysis
              run: composer run-script phpstan

            - name: Run test suite on SQLite
              run: composer run-script --timeout=600 test

    mysql-tests:
        name: Tests on MySQL
        services:
            mysql:
                image: mysql:8.0
                ports:
                    - 3306/tcp
                env:
                    MYSQL_RANDOM_ROOT_PASSWORD: true
                    MYSQL_USER: mysql
                    MYSQL_PASSWORD: mysql
                    MYSQL_DATABASE: testdb
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5
        runs-on: "ubuntu-26.04"
        timeout-minutes: 60

        strategy:
            fail-fast: false
            matrix:
                experimental: [ false ]
                php:
                    - '7.4'
                    - '8.3'
                    - '8.4'

        steps:
            -   uses: actions/checkout@v7

            -   uses: ibexa/gh-workflows/actions/composer-install@main
                with:
                    php-version: ${{ matrix.php }}
                    php-extensions: pdo_mysql, gd
                    gh-client-id: ${{ secrets.AUTOMATION_CLIENT_ID }}
                    gh-client-secret: ${{ secrets.AUTOMATION_CLIENT_SECRET }}
                    satis-network-key: ${{ secrets.SATIS_NETWORK_KEY }}
                    satis-network-token: ${{ secrets.SATIS_NETWORK_TOKEN }}

            -   name: Setup problem matchers for PHPUnit
                run: echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

            -   name: Run integration test suite vs MySQL
                run: composer run-script test
                env:
                    MYSQL_DATABASE_URL: "mysql://mysql:mysql@127.0.0.1:${{ job.services.mysql.ports[3306] }}/testdb"
