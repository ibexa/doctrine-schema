parameters:
    # MySQL applies these; PostgreSQL and SQLite ignore them. Stating them keeps the generated
    # DDL identical across servers, and matches the character set and collation that
    # ibexa/installer's upgrade scripts converge every table on.
    ibexa.schema.default_table_options: !php/const Ibexa\Contracts\DoctrineSchema\Database\DefaultTableOptions::AS_ARRAY

services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false
    _instanceof:
        Ibexa\DoctrineSchema\Database\DbPlatform\DbPlatformInterface:
            tags: [ ibexa.doctrine.db.platform ]

    Ibexa\DoctrineSchema\Exporter\:
        resource: '../../../lib/Exporter/*'

    Ibexa\DoctrineSchema\Importer\:
        resource: '../../../lib/Importer/*'

    Ibexa\DoctrineSchema\Filter\:
        resource: '../../../lib/Filter/*'

    Ibexa\DoctrineSchema\Database\DbPlatformFactory:
        arguments:
            $dbPlatforms: !tagged_iterator ibexa.doctrine.db.platform

    Ibexa\DoctrineSchema\Database\DbPlatform\:
        resource: '../../../lib/Database/DbPlatform/*'

    Ibexa\DoctrineSchema\Builder\SchemaBuilder:
        arguments:
            $defaultTableOptions: '%ibexa.schema.default_table_options%'

    Doctrine\Common\EventManager: ~

    Ibexa\Bundle\DoctrineSchema\Command\DumpSqlCommand: ~
